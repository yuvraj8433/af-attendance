plugins {
    id 'com.android.application'
}

def ksFile   = file("release.keystore")
def ksPass   = System.getenv("KEYSTORE_PASSWORD")
def buildNum = (System.getenv("VERSION_CODE") ?: "1") as Integer

android {
    namespace = 'com.airflow.attendance'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.airflow.attendance'
        minSdk = 26
        targetSdk = 34
        versionCode = buildNum
        versionName = "1.0." + buildNum
    }

    signingConfigs {
        release {
            if (ksFile.exists() && ksPass) {
                storeFile = ksFile
                storePassword = ksPass
                keyAlias = "airflow"
                keyPassword = ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
